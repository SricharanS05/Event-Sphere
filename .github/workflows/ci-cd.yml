name: Event Sphere CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build backend
        working-directory: event-management-backend
        run: bash mvnw clean package -DskipTests

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: event-management-frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: event-management-frontend
        run: npm ci

      - name: Build frontend
        working-directory: event-management-frontend
        run: npm run build

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build backend Docker image
        run: docker build -t sricharan1407/event-sphere-backend:latest ./event-management-backend

      - name: Build frontend Docker image
        run: docker build -t sricharan1407/event-sphere-frontend:latest ./event-management-frontend

      - name: Push backend Docker image
        run: docker push sricharan1407/event-sphere-backend:latest

      - name: Push frontend Docker image
        run: docker push sricharan1407/event-sphere-frontend:latest

  deploy:
    name: Deploy to AWS EC2
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull sricharan1407/event-sphere-backend:latest
            docker pull sricharan1407/event-sphere-frontend:latest

            docker rm -f event-sphere-backend || true
            docker rm -f event-sphere-frontend || true

            docker run -d \
              --name event-sphere-backend \
              --env-file /etc/event-sphere/backend.env \
              -p 8080:8080 \
              --restart unless-stopped \
              sricharan1407/event-sphere-backend:latest

            docker run -d \
              --name event-sphere-frontend \
              -p 4173:80 \
              --restart unless-stopped \
              sricharan1407/event-sphere-frontend:latest

            docker ps
            # CD deployment completed