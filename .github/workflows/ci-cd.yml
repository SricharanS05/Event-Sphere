name: Event Sphere CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build backend
        working-directory: event-management-backend
        run: ./mvnw clean package -DskipTests

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: event-management-frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: event-management-frontend
        run: npm ci

      - name: Build frontend
        working-directory: event-management-frontend
        run: npm run build

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build backend Docker image
        run: docker build -t sricharan1407/event-sphere-backend:latest ./event-management-backend

      - name: Build frontend Docker image
        run: docker build -t sricharan1407/event-sphere-frontend:latest ./event-management-frontend

      - name: Push backend Docker image
        run: docker push sricharan1407/event-sphere-backend:latest

      - name: Push frontend Docker image
        run: docker push sricharan1407/event-sphere-frontend:latest